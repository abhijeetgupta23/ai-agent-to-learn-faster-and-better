name: Story
description: One testable user outcome. The spec every agent works from.
labels: [story]
body:
  - type: textarea
    id: plain
    attributes:
      label: In plain words
      description: Explain it like I'm 5. Two or three short sentences and a tiny before/after picture. No file names or jargon; the details go below.
      placeholder: |
        Learners get stuck when they type an answer and nothing tells them if it's right.
        We'll add a "Your turn" check after each lesson step: right answer → next step, wrong → a hint, then try again.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who and state
      description: Who is the user, and where are they when this happens?
      placeholder: A learner partway through a lesson plan.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Action
      description: What does the user (or system) do?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observably changes? Avoid vague words like "better".
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable lines. Each becomes at least one test. Include failure cases, not just the happy path.
      value: |
        - [ ] 
        - [ ] 
        - [ ] (failure case) 
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive areas
      description: Ticking any box makes this tier L. Full list in .github/sensitive-paths.txt.
      options:
        - label: Money (spend caps, cost, rate limits), auth or payments
        - label: User data or its shape (memory store, schemas, migrations)
        - label: Secrets, model access, or prompt-injection defences
        - label: Deploy, dependencies, or CI
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: "Pick the highest that fits; when unsure go up. L: any sensitive box ticked, more than one src/ package, or a new module / data model change. M: new behaviour a user can notice, or a new src/ file. S: a fix or tweak in one area, no new behaviour (auto-merges). CI enforces the minimum."
      options: [S, M, L]
    validations:
      required: true
