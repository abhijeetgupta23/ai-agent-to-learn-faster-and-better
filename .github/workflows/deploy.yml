name: Deploy

# CD: after CI passes on main, deploy to Fly.io, but only once the owner
# approves in the GitHub "production" environment. Runs the default branch's
# copy of this file (workflow_run), never a PR's.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # to see whether main's tip passed CI

# One deploy at a time; a newer approved deploy waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Fly (production)
    # Only a green CI run from a push to main (not a PR), or a manual run of main.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://adaptive-learning-2.fly.dev
    env:
      FLYCTL_VERSION: 0.4.110
      FLYCTL_SHA256: 62b48471d4d560831ec27a3c316c402750d34a3f5f8b956459d7cc5f6125ec97
      # The commit CI tested; a manual run uses main's tip.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Never roll back. If main moved on (an older CI run finished late), ship
      # main's tip instead when its CI already passed; otherwise skip, because the
      # tip's own CI run arrives later and deploys it. A stale arrival can evict
      # the tip's queued run, so this keeps the newest green commit from being lost.
      - name: Pick the commit to ship
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$tip&event=push&status=success&per_page=1" --jq .total_count)" -gt 0 ]; then
            echo "::notice::$SHA is stale; shipping main's tip $tip (CI passed)"
            echo "sha=$tip" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping $SHA: main is at $tip, whose CI hasn't passed yet"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}

      # Pinned release, checked against its published SHA-256 before use.
      - name: Install flyctl ${{ env.FLYCTL_VERSION }}
        if: steps.target.outputs.sha != ''
        run: |
          f="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/$f"
          echo "$FLYCTL_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/flyctl"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/flyctl"
          echo "$RUNNER_TEMP/flyctl" >> "$GITHUB_PATH"

      # The Fly token is a production-environment secret, and only this step sees it.
      - name: Deploy
        if: steps.target.outputs.sha != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app adaptive-learning-2

      - name: Check the live app is healthy
        if: steps.target.outputs.sha != ''
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        # Machines scale to zero, so the first request can take a few seconds.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://adaptive-learning-2.fly.dev/health; then
              echo; echo "Healthy after deploy of $TARGET"; exit 0
            fi
            sleep 10
          done
          echo "::error::/health did not return OK within 2 minutes after deploying $TARGET"
          exit 1
