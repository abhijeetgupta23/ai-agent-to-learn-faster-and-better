name: Deploy

# Ships main to Fly after CI passes on it, then pings /health. Also has a manual "Run workflow"
# button for re-deploys. Needs the repo secret FLY_API_TOKEN (a deploy-only token for the app);
# without it the job skips with a notice instead of failing.
#
# No live agent evals here: they cost money. When there are real users, add an eval gate (and a
# manual approval environment) before the deploy step.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful CI run from a push to main (not a PR), or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://adaptive-learning-2.fly.dev
    steps:
      # Two guards: a token must exist, and the commit must still be the tip of main. Without the
      # second, an older commit whose CI finishes late would roll production back over a newer one.
      - name: Check token and that this commit is still the newest main
        id: token
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed. Add it under Settings → Secrets → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::Skipped: $SHA is no longer the tip of main ($tip). The newer commit deploys after its own CI run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Deploy exactly the commit CI tested.
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.ok == 'true'

      - name: fly deploy
        if: steps.token.outputs.ok == 'true'
        run: flyctl deploy --remote-only

      - name: Health check
        if: steps.token.outputs.ok == 'true'
        run: |
          # The app scales to zero, so the first request may wait for a machine to boot.
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$APP_URL/health" | grep -q '"ok"'; then
              echo "Live: $APP_URL/visual/"
              exit 0
            fi
            echo "Not healthy yet (try $i), waiting..."
            sleep 10
          done
          echo "::error::$APP_URL/health did not answer ok after deploy. Roll back with: fly releases, then fly deploy --image <previous image>."
          exit 1
