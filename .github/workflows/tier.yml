name: Tier

# pull_request_target runs THIS file as it is on the base branch, so a PR can't
# rewrite the gate that grades it. The PR's commits are fetched as data and only
# diffed; nothing from the PR is executed. Separate from CI so label changes
# re-run only this check.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, auto_merge_enabled, auto_merge_disabled]

permissions:
  contents: read

jobs:
  tier-check:
    name: tier-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (trusted checker and rules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the PR's commits (diffed only, never run)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diff must not be labelled below its minimum tier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
        run: >
          python -I .github/scripts/check_tier.py
          --base "$BASE_SHA" --head refs/remotes/pr/head
          --labels "$LABELS" --auto-merge "$AUTO_MERGE"
